<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>法典笔记 · 宣传片 A</title>
<!-- One frame is drawn for any time t (seconds) asked for: window.renderFrame(t). 抓帧.mjs drives t frame by
     frame and 渲染.py joins the pictures with ffmpeg. Nothing animates by itself, so every run gives the
     same film, and a single scene can be re-rendered on its own. -->
<style>
  html,body{margin:0;background:#0E1512;overflow:hidden}
  canvas{display:block}
</style></head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>
'use strict';
// Ink-dark ground lifted towards jade and night blue; vermilion and amber carry the accents, and each
// method of interpretation has its own colour (used in film B and on the method chips).
// Portrait films (竖屏) draw on 1080×1920; every scene reads W and H, and checks PORTRAIT where the
// layout has to change.
let PORTRAIT=!!window.PORTRAIT,W=PORTRAIT?1080:1920,H=PORTRAIT?1920:1080;
const PAPER='#F7F3E8',INK='#0F2A2B',SEAL='#F05A3C',GOLD='#F2B544',DIM='rgba(247,243,232,.66)';
const JADE='#4FD1B0',SKY='#7DB7F5',CORAL='#FF8A65',VIOLET='#B79CFF';
const METHOD={'文义解释':SKY,'体系解释':JADE,'历史解释':GOLD,'目的解释':CORAL,'比较法解释':VIOLET,'法权分析':SEAL};
const SERIF='"Songti SC","STSong","Fadian Serif",serif',SANS='"PingFang SC","Hiragino Sans GB",sans-serif';
// VY: in portrait, a scene laid out for a 1080-high band is moved to the middle of the screen.
let VY=PORTRAIT?(H-1080)/2:0;
const canvas=document.getElementById('stage'),g=canvas.getContext('2d');

// ---------- data, filled in by 渲染.py ----------
const LAWS=window.LAWS||[],STRICT=window.STRICT||[],TEXT=window.TEXT||{},TOTAL=window.TOTAL||60;

// ---------- motion ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
// Everything starts and stops; nothing overshoots.
const ease=t=>t<=0?0:t>=1?1:1-Math.pow(1-t,3);
const step=(t,start,span)=>ease(clamp((t-start)/span));
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ---------- drawing ----------
function text(s,x,y,{size=48,font=SERIF,color=PAPER,align='left',alpha=1,weight=400,spacing=0}={}){
  if(alpha<=0||!s)return;
  g.save();g.globalAlpha*=clamp(alpha);g.fillStyle=color;g.textAlign=align;g.textBaseline='alphabetic';
  if(spacing&&'letterSpacing' in g)g.letterSpacing=spacing+'px';
  g.font=`${weight} ${size}px ${font}`;
  // Letter spacing adds space after the last glyph too; give half of it back so centred type stays centred.
  g.fillText(s,align==='center'&&spacing?x+spacing/2:x,y);g.restore();
}
function line(x1,y1,x2,y2,color=GOLD,width=1,alpha=1){
  if(alpha<=0)return;
  g.save();g.globalAlpha*=clamp(alpha);g.strokeStyle=color;g.lineWidth=width;g.lineCap='round';
  g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.restore();
}
function grow(x,y,w,p,color=GOLD,height=1){if(p<=0)return;g.save();g.fillStyle=color;g.fillRect(x,y,w*clamp(p),height);g.restore();}
function rounded(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
const NO_START='，。、；：？！”’）》」』…';
function measure(s,size,font=SERIF){g.save();g.font=`400 ${size}px ${font}`;const w=g.measureText(s).width;g.restore();return w;}

// Text set to a width. Returns the lines and the y just below them.
function flow(s,x,y,maxWidth,{size=44,font=SERIF,color=PAPER,lineHeight=1.8,align='left',alpha=1}={}){
  const lh=size*lineHeight,out=[];
  g.save();g.font=`400 ${size}px ${font}`;
  let line='';
  for(const ch of s){
    if(ch==='\n'){out.push(line);line='';continue;}
    if(g.measureText(line+ch).width>maxWidth&&line&&!NO_START.includes(ch)){out.push(line);line=ch;}else line+=ch;
  }
  if(line)out.push(line);g.restore();
  out.forEach((l,i)=>text(l,align==='center'?x:x,y+i*lh,{size,font,color,align,alpha}));
  return {lines:out,bottom:y+(out.length-1)*lh,next:y+out.length*lh};
}
// A red (or gold) rule under one phrase inside a block of flowing text.
// A key word or phrase is marked by colour and a soft glow, never by a rule under it.
function splitLine(str,size,font,keep=[]){
  const chars=[...str],max=W-150;if(measure(str,size,font)<=max)return [str];
  const n=Math.ceil(measure(str,size,font)/max),out=[];let rest=str;
  for(let k=n;k>1;k--){
    const target=[...rest].length/k,c=[...rest];let best=-1,score=1e9;
    for(let i=1;i<c.length-1;i++){
      const head=c.slice(0,i).join('');if(measure(head,size,font)>max)break;
      if(keep.some(w=>{const j=rest.indexOf(w);return j>=0&&j<head.length&&j+w.length>head.length;}))continue;
      if('，。、；：！？'.includes(c[i]))continue;
      const punct='，。、；：！？'.includes(c[i-1])?0:4;const sc=Math.abs(i-target)+punct;if(sc<score){score=sc;best=i;}
    }
    if(best<0)best=Math.floor(target);
    out.push(c.slice(0,best).join(''));rest=c.slice(best).join('');
  }
  out.push(rest);return out;
}
function glowText(str,x,y,{size=44,font=SERIF,color=SEAL,alpha=1,align='left',t=0}={}){
  if(alpha<=0||!str)return;
  g.save();g.globalAlpha=clamp(alpha);g.fillStyle=color;g.textAlign=align;g.font=`400 ${size}px ${font}`;
  g.shadowColor=color;g.shadowBlur=size*.45*(.85+.15*Math.sin(t*1.6));g.fillText(str,x,y);
  g.shadowBlur=0;g.fillText(str,x,y);g.restore();
}
function underlineWord(full,word,x,y,{maxWidth,size=44,font=SERIF,lineHeight=1.8,align='left',alpha=1,color=SEAL}={}){
  if(alpha<=0)return;
  const lh=size*lineHeight,lines=[];let line='';
  g.save();g.font=`400 ${size}px ${font}`;
  for(const ch of full){if(g.measureText(line+ch).width>maxWidth&&line&&!NO_START.includes(ch)){lines.push(line);line=ch;}else line+=ch;}
  if(line)lines.push(line);g.restore();
  const idx=full.indexOf(word);if(idx<0)return;
  // The word may break across lines: colour each piece where it stands.
  let consumed=0;
  lines.forEach((L,i)=>{
    const a=Math.max(idx,consumed),b=Math.min(idx+word.length,consumed+L.length);
    if(a<b){const lineW=measure(L,size,font),startX=align==='center'?x-lineW/2:x;
      glowText(full.slice(a,b),startX+measure(L.slice(0,a-consumed),size,font),y+i*lh,{size,font,color,alpha,t:window.__t||0});}
    consumed+=L.length;
  });
}

// ---------- paper ----------
const grainCanvas=document.createElement('canvas');grainCanvas.width=grainCanvas.height=256;
const grain=grainCanvas.getContext('2d');
function drawGrain(frame){
  const img=grain.createImageData(256,256),rnd=mulberry(frame*7919+13);
  for(let i=0;i<img.data.length;i+=4){const v=205+Math.floor(rnd()*50);img.data[i]=img.data[i+1]=img.data[i+2]=v;img.data[i+3]=255;}
  grain.putImageData(img,0,0);
  g.save();g.globalAlpha=.022;g.globalCompositeOperation='overlay';
  g.fillStyle=g.createPattern(grainCanvas,'repeat');g.fillRect(0,0,W,H);g.restore();
}
// The ground: a diagonal from deep jade to night blue, with two soft glows drifting very slowly.
function background(t){
  const lin=g.createLinearGradient(0,0,W,H);
  lin.addColorStop(0,'#123F3A');lin.addColorStop(.55,'#0F2A2F');lin.addColorStop(1,'#141F3C');
  g.fillStyle=lin;g.fillRect(0,0,W,H);
  const glow=(x,y,r,color,a)=>{const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,color.replace('A',a));gr.addColorStop(1,color.replace('A',0));g.fillStyle=gr;g.fillRect(0,0,W,H);};
  glow(W*(.22+.05*Math.sin(t*.11)),H*(.25+.06*Math.cos(t*.09)),760,'rgba(79,209,176,A)',.16);
  glow(W*(.8+.04*Math.cos(t*.08)),H*(.78+.05*Math.sin(t*.1)),820,'rgba(125,183,245,A)',.13);
  glow(W*(.62+.05*Math.sin(t*.07+1)),H*(.18),520,'rgba(242,181,68,A)',.06);
}
function vignette(){
  const v=g.createRadialGradient(W/2,H/2,H*0.4,W/2,H/2,H*1.05);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.24)');
  g.save();g.fillStyle=v;g.fillRect(0,0,W,H);g.restore();
}

// ---------- 0–6 s: a plate, a gold rule, the name of the code ----------
function open(t){
  const a=step(t,.2,1.6),w=step(t,.8,1.6),sub=step(t,2.4,1.4);
  kinetic(TEXT.open?.[0]||'',470+VY,t,.2,{size:96,per:.1});
  
  text(TEXT.open?.[1],W/2,578+VY,{size:32,align:'center',alpha:sub,color:DIM,font:SANS,spacing:6});
  // Film A is about 体系解释: the method is named once, in its colour, at the start.
  const tag=TEXT.open?.[2];if(tag){const w=measure(tag,30,SANS)+42;chip(tag,W/2-w/2,680+VY,{alpha:step(t,3.4,1),size:30});}
}

// ---------- Film A, act 1: Article 13 at the centre, the system around it, ring by ring ----------
// The rings and threads are in 场景.json (TEXT.web); the article itself comes from the data pack.
const TONE={jade:JADE,sky:SKY,gold:GOLD,coral:CORAL,violet:VIOLET,seal:SEAL};
function seedOf(id){let h=7;for(const ch of id)h=(h*31+ch.charCodeAt(0))%9973;return h/9973*Math.PI*2;}
function webPoint(n,cx,cy,rings,t=0){
  if(n.id==='c')return {x:cx,y:cy};
  // Each node drifts slowly on its own orbit, so the system never stands still.
  const r=rings[n.ring],sd=seedOf(n.id),a=(n.angle+1.6*Math.sin(t*.32+sd))*Math.PI/180,k=1+.014*Math.sin(t*.47+sd*1.7);
  return {x:cx+Math.cos(a)*r.rx*k,y:cy+Math.sin(a)*r.ry*k,a};
}
function a13(t,t0){
  const web=TEXT.web||{},rings=web.rings||[],nodes=web.nodes||[],threads=web.threads||[];
  const cx=W/2,cy=PORTRAIT?H/2+60:585,paras=TEXT.a13?.slice(1)||[];
  if(PORTRAIT){web.rings&&(web.__p||(web.__p={rings:web.rings.map((r,i)=>({...r,rx:[165,265,345][i]||r.ry,ry:[300,500,700][i]||r.rx,labelAngle:-90})),
    nodes:web.nodes.map(n=>({...n,angle:90-n.angle}))}));}
  const RG=PORTRAIT?web.__p.rings:rings,ND=PORTRAIT?web.__p.nodes:nodes;
  // 1. The article, its three ideas in three colours, and the words that leave the matter to law.
  const showText=step(t,t0,.9)*(1-step(t,t0+7.2,.9));
  if(showText>0){
    if(PORTRAIT){
      text(TEXT.a13?.[0],W/2,420,{size:64,align:'center',alpha:showText,spacing:8});
      let y=580;
      paras.forEach((p,i)=>{const a=step(t,t0+.5+i*.35,.8)*showText,size=42;
        const box=flow(p,W/2,y,W-140,{size,align:'center',alpha:a,lineHeight:1.7});
        (web.phrases||[]).forEach(([word,tone],k)=>{if(!p.includes(word))return;const hl=step(t,t0+1.8+k*.9,.7)*showText;
          underlineWord(p,word,W/2,y,{maxWidth:W-140,size,lineHeight:1.7,align:'center',alpha:hl,color:TONE[tone]||SEAL});});
        y=box.next+40;});
    }else{
    text(TEXT.a13?.[0],W/2,250,{size:60,align:'center',alpha:showText,spacing:8});
      const size=40,lh=86;
      paras.forEach((p,i)=>{
        const y=390+i*lh,x=W/2-measure(p,size)/2,a=step(t,t0+.5+i*.35,.8)*showText;
        text(p,x,y,{size,alpha:a});
        (web.phrases||[]).forEach(([word,tone],k)=>{
          const at=p.indexOf(word);if(at<0)return;
          const px=x+measure(p.slice(0,at),size),pw=measure(word,size),hl=step(t,t0+1.8+k*.9,.7)*showText;
          if(hl<=0)return;
          glowText(word,px,y,{size,color:TONE[tone]||SEAL,alpha:hl,t});
          
        });
      });
    }
  }
  // 2. The article becomes a point.
  const core=step(t,t0+7.6,1);
  // 3. Rings: each layer opens outwards, then its nodes arrive.
  RG.forEach((r,i)=>{
    const open=step(t,t0+8.4+i*2.6,1.4);if(open<=0)return;
    g.save();g.strokeStyle=TONE[r.tone]||GOLD;g.globalAlpha=.32*open;g.lineWidth=1.2;g.setLineDash([3,7]);
    g.beginPath();g.ellipse(cx,cy,r.rx*open,r.ry*open,0,0,Math.PI*2);g.stroke();g.restore();
    const la=r.labelAngle*Math.PI/180;
    // Portrait: the ring names form a legend under the title instead of sitting on the rings.
    if(PORTRAIT)text(r.name,90,230+i*46,{size:26,font:SANS,color:TONE[r.tone]||GOLD,alpha:step(t,t0+9+i*2.6,1),spacing:2});
    else text(r.name,cx+Math.cos(la)*r.rx,cy+Math.sin(la)*r.ry-14,{size:20,font:SANS,align:'center',color:TONE[r.tone]||GOLD,alpha:step(t,t0+9+i*2.6,1),spacing:2});
  });
  const byId=Object.fromEntries(ND.map(n=>[n.id,n]));byId.c={id:'c'};
  const pos=id=>webPoint(byId[id],cx,cy,RG,t);
  const appear=n=>n.id==='c'?core:step(t,t0+9+n.ring*2.6+(n.order||0)*.28,.8);
  // Which thread is lit now; before the first and after the last, none and all.
  const tStart=t0+17.6,tSpan=5.2,k=Math.floor((t-tStart)/tSpan);
  const current=t<tStart?-1:k<threads.length?k:threads.length;
  const lit=new Map();
  threads.forEach((th,i)=>{if(current===threads.length||i===current)for(const [a,b] of th.edges){lit.set(a+'>'+b,th);lit.set(a,th);lit.set(b,th);}});
  const dimmed=current>=0&&current<threads.length;
  // Edges: every relation in any thread, faint until its thread is lit.
  threads.forEach(th=>th.edges.forEach(([a,b])=>{
    const A=pos(a),B=pos(b),p=Math.min(appear(byId[a]),appear(byId[b]));if(p<=0)return;
    const on=lit.has(a+'>'+b),glow=on?step(t,current===threads.length?tStart+threads.length*tSpan:tStart+threads.indexOf(th)*tSpan,.7):0;
    const mx=(A.x+B.x)/2,my=(A.y+B.y)/2,qx=a==='c'?mx:cx+(mx-cx)*1.18,qy=a==='c'?my:cy+(my-cy)*1.18;
    g.save();g.lineCap='round';
    g.strokeStyle=on?TONE[th.tone]:'rgba(247,243,232,.5)';g.globalAlpha=p*(on?.35+.6*glow:dimmed?.12:.22);g.lineWidth=on?1.4+1.6*glow:1;
    g.beginPath();g.moveTo(A.x,A.y);
    const steps=Math.max(2,Math.round(40*p));
    for(let s=1;s<=steps;s++){const u=s/40;g.lineTo((1-u)**2*A.x+2*(1-u)*u*qx+u*u*B.x,(1-u)**2*A.y+2*(1-u)*u*qy+u*u*B.y);}
    g.stroke();g.restore();
    // Impulses run outward along every finished thread: brighter, and more of them, on a lit thread.
    if(p>=1){
      const n=on?3:1,sd=seedOf(a+b);
      for(let k=0;k<n;k++){
        const u=((t*(on?.32:.18)+sd/6.283+k/n)%1),ix=(1-u)**2*A.x+2*(1-u)*u*qx+u*u*B.x,iy=(1-u)**2*A.y+2*(1-u)*u*qy+u*u*B.y;
        const glowA=(on?.95:dimmed?.15:.4)*Math.sin(Math.PI*u);
        const gr=g.createRadialGradient(ix,iy,0,ix,iy,on?14:9);gr.addColorStop(0,on?TONE[th.tone]:'rgba(247,243,232,.9)');gr.addColorStop(1,'rgba(0,0,0,0)');
        g.save();g.globalAlpha=glowA;g.fillStyle=gr;g.beginPath();g.arc(ix,iy,on?14:9,0,Math.PI*2);g.fill();g.restore();
      }
    }
  }));
  // Nodes and their labels.
  ND.forEach(n=>{
    const p=appear(n);if(p<=0)return;
    const P=pos(n.id),th=lit.get(n.id),fade=dimmed&&!th?.42:1,tone=th?TONE[th.tone]:TONE[RG[n.ring].tone];
    g.save();g.globalAlpha=p*fade;g.fillStyle=th?tone:'#0F2A2F';g.strokeStyle=tone;g.lineWidth=1.6;
    g.beginPath();g.arc(P.x,P.y,th?7:5.5,0,Math.PI*2);g.fill();g.stroke();g.restore();
    const c=Math.cos(P.a),sn=Math.sin(P.a),side=c>.3?'left':c<-.3?'right':'center';
    let lx=P.x+(side==='left'?16:side==='right'?-16:0);
    if(PORTRAIT){const w=Math.max(measure(n.name,23),n.note?measure(n.note,17,SANS):0);if(side==='left')lx=Math.min(lx,W-30-w);else if(side==='right')lx=Math.max(lx,30+w);else lx=Math.min(Math.max(lx,30+w/2),W-30-w/2);}
    const ly=side==='center'?(sn<0?P.y-42:P.y+34):P.y-4;
    text(n.name,lx,ly,{size:23,align:side,alpha:p*fade});
    if(n.note)text(n.note,lx,ly+25,{size:17,font:SANS,align:side,color:DIM,alpha:p*fade});
  });
  // The centre breathes: a ripple leaves it every three seconds.
  if(core>=1)for(let k=0;k<2;k++){const u=((t-t0)/3+k/2)%1,r=118+150*u;
    g.save();g.globalAlpha=.35*(1-u);g.strokeStyle=SEAL;g.lineWidth=1.5;g.beginPath();g.ellipse(cx,cy,r*1.25,r*.85,0,0,Math.PI*2);g.stroke();g.restore();}
  // The centre.
  if(core>0){
    g.save();g.globalAlpha=core;g.fillStyle='#2A2F2B';g.strokeStyle=SEAL;g.lineWidth=2;
    g.beginPath();g.arc(cx,cy,118*(.6+.4*core),0,Math.PI*2);g.fill();g.fillStyle='rgba(240,90,60,.18)';g.fill();g.stroke();g.restore();
    text(TEXT.a13?.[0],cx,cy-4,{size:42,align:'center',alpha:core,spacing:3});
    text(web.centre,cx,cy+38,{size:21,font:SANS,align:'center',color:'#FFD2C4',alpha:core});
  }
  text(web.title,PORTRAIT?90:110,PORTRAIT?170:120,{size:40,alpha:step(t,t0+8,1),spacing:4});
  
  // Caption of the lit thread, or the closing line.
  threads.forEach((th,i)=>{
    const a=step(t,tStart+i*tSpan,.5)*(1-step(t,tStart+(i+1)*tSpan-.4,.4));
    text(th.caption,W/2,H-46,{size:26,font:SANS,align:'center',color:TONE[th.tone],alpha:a});
  });
  text(web.closing,W/2,H-46,{size:28,align:'center',alpha:step(t,tStart+threads.length*tSpan,.8)});
}

// ---------- 22–32 s: a ring of 143 articles and 56 laws, a net of chords, one line across codes ----------
function a56(t,t0){
  const cx=PORTRAIT?W/2:W/2-60,cy=PORTRAIT?H/2-20:H/2+10,rIn=PORTRAIT?150:190,rOut=PORTRAIT?300:380;
  const ring=step(t,t0,.9),names=step(t,t0+1.4,1.6),net=step(t,t0+3.4,3.2),cross=step(t,t0+6,2);
  // Inner ring: one tick for each of the 143 articles; the twelve that say 由法律规定 are red.
  for(let i=0;i<143;i++){
    const on=clamp(ring*1.25-i/143);if(on<=0)continue;
    const a=-Math.PI/2+i/143*Math.PI*2,strict=STRICT.includes('a'+(i+1)),len=strict?30:12;
    line(cx+Math.cos(a)*rIn,cy+Math.sin(a)*rIn,cx+Math.cos(a)*(rIn+len),cy+Math.sin(a)*(rIn+len),strict?SEAL:GOLD,strict?3:1.4,on*(strict?.95:.8));
  }
  // Outer ring: 56 ticks, one for each of the 宪法相关法.
  for(let i=0;i<LAWS.length;i++){
    const on=clamp(ring*1.2-i/LAWS.length*1.1);if(on<=0)continue;
    const a=-Math.PI/2+i/LAWS.length*Math.PI*2;
    line(cx+Math.cos(a)*rOut,cy+Math.sin(a)*rOut,cx+Math.cos(a)*(rOut+22),cy+Math.sin(a)*(rOut+22),GOLD,2.2,on*.95);
  }
  // Six names only, set flat outside the ring at even angles: the rest are ticks, not words.
  // Each name sits at its own tick: the position comes from the official list, not from the script.
  const picked=['全国人民代表大会和地方各级人民代表大会选举法','民族区域自治法','国旗法','国家赔偿法','立法法','监察法','对外关系法']
    .map(full=>[LAWS.indexOf(full),full.length>8?full.slice(-3):full]).filter(([i])=>i>=0);
  picked.forEach(([i,name],k)=>{
    const a=-Math.PI/2+i/LAWS.length*Math.PI*2,p=step(t,t0+1.6+k*.42,1);
    if(p<=0)return;
    const cos=Math.cos(a),flat=Math.abs(cos)<.45;
    const x=cx+Math.cos(a)*(rOut+72),y=cy+Math.sin(a)*(rOut+72);
    const align=flat?'center':cos>0?'left':'right';
    // Above or below the centre the label sits straight above or below its own tick; beside the
    // centre it needs a short lead line to say which tick it belongs to.

// ---------- 52–60 s: the plate again, with the idea ----------
// ---------- Kinetic type: a sentence set character by character, then its key words light up ----------
// keys: [[word, tone, mode]] — mode 'glow' (takes its colour and glows) or 'fade' (steps back, dimmed).
// enter: 'rise' (each character rises into place) or 'weave' (characters come alternately from above
// and below, as a thread goes over and under).
function kinetic(str,y,t,start,{size=64,keys=[],enter='rise',per=.08,keyAt=null,font=SERIF,color=PAPER,x=W/2,align='center'}={}){
  // Portrait: a line too wide for the screen breaks at punctuation (else at the middle), never inside a
  // key word, and the pieces are set one under another around y.
  if(PORTRAIT&&align==='center'&&!arguments[5]?.__part&&measure(str,size,font)>W-150){
    const parts=splitLine(str,size,font,keys.map(k=>k[0])),lh=size*1.42,y0=y-(parts.length-1)*lh/2;
    let at=start,end=start;
    parts.forEach((part,i)=>{end=Math.max(end,kinetic(part,y0+i*lh,t,at,{size,keys:keys.filter(k=>part.includes(k[0])),enter,per,keyAt,font,color,x,align,__part:true}));at+=[...part].length*per;});
    return end;
  }
  const chars=[...str];g.save();g.font=`400 ${size}px ${font}`;
  const ws=chars.map(c=>g.measureText(c).width),total=ws.reduce((a,b)=>a+b,0);g.restore();
  const ranges=keys.map(([word,tone,mode])=>{const at=str.indexOf(word);if(at<0)return null;const i=[...str.slice(0,at)].length;return {i,j:i+[...word].length,tone:TONE[tone]||tone,mode:mode||'glow'};}).filter(Boolean);
  const k0=keyAt??start+chars.length*per+.6;
  const lit=ranges.map((r,k)=>step(t,k0+k*.9,1.1));
  let cx=align==='center'?x-total/2:x;
  chars.forEach((ch,i)=>{
    const p=step(t,start+i*per,.9);if(p<=0){cx+=ws[i];return;}
    const dy=enter==='weave'?(i%2?-1:1)*22*(1-p):14*(1-p);
    const r=ranges.findIndex(R=>i>=R.i&&i<R.j),R=ranges[r],kp=r>=0?lit[r]:0;
    g.save();g.font=`400 ${size}px ${font}`;g.textBaseline='alphabetic';
    if(p<1)g.filter=`blur(${(1-p)*9}px)`;
    if(R&&R.mode==='fade'){g.globalAlpha=p*(1-.62*kp);g.fillStyle=color;}
    else if(R&&kp>0){
      // From paper to the key colour, character by character, with a slow breathing glow.
      const ck=clamp(kp*1.6-(i-R.i)*.08);
      g.globalAlpha=p;g.fillStyle=color;g.fillText(ch,cx,y+dy);
      g.globalAlpha=p*ck;g.fillStyle=R.tone;g.shadowColor=R.tone;g.shadowBlur=size*.5*ck*(.82+.18*Math.sin(t*1.5+i*.4));
    }else{g.globalAlpha=p;g.fillStyle=color;}
    g.fillText(ch,cx,y+dy);g.restore();
    cx+=ws[i];
  });
  return k0+ranges.length*.9;
}

// A torch from one sphere lights the other; then the other way round; at the end all the cells meet

  while(pts.length<n){const a=rnd()*Math.PI*2,d=Math.sqrt(rnd())*(R-r-8);pts.push({x:Math.cos(a)*d,y:Math.sin(a)*d});}
  const gap=2*r+16;

    for(let a=0;a<pts.length;a++)for(let b=a+1;b<pts.length;b++){
      const P=pts[a],Q=pts[b],dx=Q.x-P.x,dy=Q.y-P.y,d=Math.hypot(dx,dy)||.01;if(d>=gap)continue;
      const push=(gap-d)/2,ux=dx/d,uy=dy/d;

// ---------- Film A: 往返 · 穿梭 · 编织 — a mind grows into a net ----------
// A seed of thought grows towards three fields — law and law, article and article, law and reality —
// by space colonisation (Runions, Lane, Prusinkiewicz 2007): every branch reaches for the nearest

let NET=null;

      for(let n=0;n<nodes.length;n++){const dx=a.x-nodes[n].x,dy=a.y-nodes[n].y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=n;}}

      const v=pull.get(best)||{x:0,y:0,c:[0,0,0]};const l=Math.sqrt(bd);v.x+=(a.x-nodes[best].x)/l;v.y+=(a.y-nodes[best].y)/l;if(a.f>=0)v.c[a.f]++;pull.set(best,v);}

// Kinetic type: 外壳可以更换，工具可以更新；在笔记里生长的理性技艺，才是灵魂。

// forward, 理性技艺 grows, 灵魂 glows and stays while the rest steps back.
function kineticLine(str,keys,x,y,size,t,start,{align='center',dim=0}={}){
  const total=measure(str,size),x0=align==='center'?x-total/2:x;let cx=x0;
  for(let i=0;i<str.length;i++){
    const ch=str[i],w=measure(ch,size),ts=start+i*.07,p=ease(clamp((t-ts)/.5));
    const key=keys.find(k=>i>=k.at&&i<k.at+k.word.length);

    if(key){const kp=ease(clamp((t-key.start)/.7));color=kp>0?key.color:PAPER;alpha=p*(1-dim*(key.keep?0:1));
      if(key.move==='flip'){const f=clamp((t-key.start)/.8);sx=Math.abs(Math.cos(f*Math.PI*2));if(f>=1)sx=1;}
      if(key.move==='grow'){const s2=1+.1*kp;sx=sy=s2;dy-=6*kp;}
      if(key.move==='tick'){dy-=6*Math.sin(clamp((t-key.start)/.6)*Math.PI);}
      if(key.move==='glow'&&kp>0){const r=size*1.4*(1+.08*Math.sin(t*3));const gr=g.createRadialGradient(cx+w/2,y-size*.35,0,cx+w/2,y-size*.35,r);
        gr.addColorStop(0,'rgba(242,181,68,'+.35*kp+')');gr.addColorStop(1,'rgba(242,181,68,0)');g.save();g.fillStyle=gr;g.fillRect(cx+w/2-r,y-size*.35-r,2*r,2*r);g.restore();sx=sy=1+.1*kp;}
    }
    g.save();g.translate(cx+w/2,y-size*.35+dy);g.scale(sx,sy);g.translate(-(cx+w/2),-(y-size*.35));
    text(ch,cx,y,{size,color,alpha});g.restore();

}

// =====================================================================================================
// 竖屏短视频版 (scenes named v…): laid out for phones and short-video apps, not adapted from landscape.
// The apps cover the top ~200 px, the bottom ~360 px and a column of buttons on the right, so a scene
// keeps its heading at 300–420, its picture at 470–1400 and its caption at 1470–1560. Type is large
// (captions 50–56, headings 80, hooks 110 and more), every scene starts at once, and the chapters of
// the film stay visible at the top. Words still come character by character, from a blur to sharp;
// key words take a colour and glow, nothing is underlined or struck out.
// =====================================================================================================
const VS={x0:84,x1:996,w:912,head:340,top:470,bot:1400,cap:1482,note:1640};
const BLACK=900;
function fontOf(size,font,weight){return `${weight} ${size}px ${font}`;}
function mw(s,size,font=SERIF,weight=400){g.save();g.font=fontOf(size,font,weight);const w=g.measureText(s).width;g.restore();return w;}
// Largest size up to `size` at which the string fits the width.
function fitSize(s,size,width=VS.w,font=SERIF,weight=400){const w=mw(s,size,font,weight);return w>width?Math.floor(size*width/w):size;}

function vChar(ch,x,y,p,{size,font,weight,color,key=null,kp=0,alpha=1,t=0,i=0,shadow=true,enter='rise'}){
  if(p<=0||alpha<=0)return;

// Lines for a width; never breaks before closing punctuation, nor inside one of the `keep` words.

}
// A block of text set character by character; keys: [[word, tone, mode]] (mode 'fade' steps back).
function vBlock(str,x,y,width,t,start,o={}){

// Several lines one under another, each typed after the one before; a line may set its own size, keys…

    if(v<.7){const w=mw(label,28,SANS)+30;box(x-w/2,y-22,w,42,{alpha:a,stroke:ic[lane],fill:'rgba(15,42,43,.92)',r:21});text(label,x,y+10,{size:28,font:SANS,align:'center',alpha:a});}
    else{g.save();g.globalAlpha=a;g.fillStyle=ic[lane];g.beginPath();g.arc(x,y,6,0,Math.PI*2);g.fill();g.restore();}}
  vCaption(M2.lines?.[0],t,t0+3.4,t0+7.4,{keys:[['理性技艺','jade']]});
  vCaption(M2.lines?.[1],t,t0+7.6,1e9,{keys:[['专属模型','gold']]});
}

// ---------- films: [start, end, scene] ----------
const SCENE_FUNCTIONS={open,a13,a56,book,motto1,motto2,weave,faquan,faquan37,balance37,end,bOpen,bLiteral,bHistory,bPurpose,bCompare,bWorld,bMethods,bFeatures,bEnd,cOpen,cCategories,cCriterion,cSteps,cAssist,cEnd,dOpen,dTime,dPersonal,dExtend,dLocal,dSmart,dEnd,d2Open,dShell,dSoul,dOutsource,dCurve,dYou,dModel,d2End,
  vHook,vEnd,vA13,vWeb,vA56,vBook,vWeave,vMotto,vFaquan,vBalance,vLiteral,vHistory,vPurpose,vCompare,vWorld,vMethods,vFeatures,vShell,vSoul,vOutsource,vCurve,vYou,vLocal,vModel};
const FILMS={};{let at=0;FILMS[window.FILM_ID||'A']=(window.SCENES||[]).map(([name,len])=>{const r=[at,at+len,SCENE_FUNCTIONS[name]];at+=len;return r;});}

// ---------- portrait cameras ----------
// A scene without its own portrait layout is drawn in landscape coordinates through a camera set in
// 场景.json (portrait.views): 'zoom' crops to a region and scales it to the screen width; 'split'
// shows two regions, one above the other (for side-by-side layouts). Scenes listed as 'native' handle
// PORTRAIT themselves.
function landscape(fn){
  const keep=[PORTRAIT,W,H,VY];PORTRAIT=false;W=1920;H=1080;VY=0;
  try{fn();}finally{[PORTRAIT,W,H,VY]=keep;}
}
function region(r,dx,dy,k,t,scene){
  const [x0,x1,y0,y1]=r;
  g.save();g.beginPath();g.rect(dx,dy,(x1-x0)*k,(y1-y0)*k);g.clip();
  g.translate(dx,dy);g.scale(k,k);g.translate(-x0,-y0);
  landscape(()=>scene[2](t,scene[0]));g.restore();
}
function drawScene(scene,t){
  // 竖屏短视频: each scene comes in with a short push-in instead of a slow fade from an empty screen.
  if(window.SHORT){const u=t-scene[0],k=1+.04*(1-ease(clamp(u/.45)));g.save();g.translate(W/2,H/2);g.scale(k,k);g.translate(-W/2,-H/2);scene[2](t,scene[0]);g.restore();return;}
  const view=PORTRAIT&&(window.VIEWS||{})[scene[2].name];
  if(!view||view.mode==='native'){scene[2](t,scene[0]);return;}
  // 'square': the scene lays itself out on a 1080-wide, h-high canvas (default 1080) that is placed in
  // the middle of the screen; text keeps its size and wraps.
  if(view.mode==='square'){const h=view.h||1080,dy=(H-h)/2+(view.dy||0),keep=[W,H,VY];
    g.save();g.translate(0,dy);W=1080;H=h;VY=0;try{scene[2](t,scene[0]);}finally{[W,H,VY]=keep;g.restore();}return;}
  if(view.mode==='zoom'){const [x0,x1,y0,y1]=view.r,k=Math.min((W-40)/(x1-x0),(H-200)/(y1-y0),view.max||1.2);
    region(view.r,(W-(x1-x0)*k)/2,(H-(y1-y0)*k)/2+(view.dy||0),k,t,scene);return;}
  if(view.mode==='split'){const parts=[view.a,view.b],gap=view.gap??60;
    const ks=parts.map(([x0,x1,y0,y1])=>Math.min((W-40)/(x1-x0),view.max||1.1));
    const hs=parts.map(([x0,x1,y0,y1],i)=>(y1-y0)*ks[i]),total=hs[0]+hs[1]+gap;
    let y=(H-total)/2;
    parts.forEach((r,i)=>{region(r,(W-(r[1]-r[0])*ks[i])/2,y,ks[i],t,scene);y+=hs[i]+gap;});
    // Elements that belong to the whole scene (title, footer) can be drawn once from a third region.
    if(view.head){const [x0,x1,y0,y1]=view.head,k=Math.min((W-40)/(x1-x0),1.1);region(view.head,(W-(x1-x0)*k)/2,view.headY??120,k,t,scene);}
    if(view.foot){const [x0,x1,y0,y1]=view.foot,k=Math.min((W-40)/(x1-x0),1.1);region(view.foot,(W-(x1-x0)*k)/2,view.footY??H-200,k,t,scene);}
    return;}
}

// ---------- frame ----------
window.renderFrame=function(time){
  if(window.COVER&&!window.__inCover){window.__inCover=true;window.renderCover(time);window.__inCover=false;return time;}
  const t=clamp(time,0,TOTAL);window.__t=t;
  g.clearRect(0,0,W,H);background(t);
  const scenes=FILMS[window.FILM_ID||'A'],scene=scenes.find(([a,b])=>t>=a&&t<b)||scenes.at(-1);
  drawScene(scene,t);
  // Each scene fades into the ground in its last 0.6 s, and the film in its last second: no hard cuts.
  const next=scenes.map(x=>x[1]).find(e=>e>t&&e<TOTAL);
  const out=window.SHORT?(next?step(t,next-.28,.28):step(t,TOTAL-.8,.8)):next?step(t,next-.6,.6):step(t,TOTAL-1,1);
  if(out>0){g.save();g.globalAlpha=out;background(t);g.restore();}
  if(window.SHORT)vChapters(t,scene[2].name);
  vignette();drawGrain(Math.round(t*(window.FPS||30)));
  return t;
};
// Cover: the frame of the cover moment with the name of the notebook and the film over it.
window.renderCover=function(time){
  window.renderFrame(time);
  g.save();g.fillStyle='rgba(10,24,26,.62)';g.fillRect(0,0,W,H);g.restore();
  text('法典笔记',W/2,H/2-10,{size:150,align:'center',spacing:24});
  
  text(window.FILM_TITLE||'',W/2,H/2+130,{size:52,align:'center',color:GOLD,spacing:8});
};
// 竖屏短视频 cover: the title large, in two lines, for a grid of thumbnails.
if(window.SHORT)window.renderCover=function(time){
  window.renderFrame(time);const K=TEXT.vcover||{};
  g.save();g.fillStyle='rgba(10,24,26,.66)';g.fillRect(0,0,W,H);g.restore();
  text('法典笔记',W/2,600,{size:60,weight:600,align:'center',color:GOLD,spacing:18});
  (K.lines||[]).forEach((l,i)=>{g.save();g.font=fontOf(fitSize(l,190,VS.w,SERIF,BLACK),SERIF,BLACK);g.textAlign='center';g.fillStyle=PAPER;g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=40;g.fillText(l,W/2,860+i*220);g.restore();});
  text(K.sub,W/2,860+(K.lines||[]).length*220+20,{size:fitSize(K.sub||'',50,VS.w,SANS,600),font:SANS,weight:600,align:'center',color:GOLD});
};
window.FILM={duration:TOTAL,fps:window.FPS||30,width:W,height:H};
window.renderFrame(0);
</script>
